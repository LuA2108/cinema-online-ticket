<article>
    <h1>Gestión de usuarios</h1>

    <div>
        <?php if (isset($_SESSION['lista_usuarios'])): ?>
            <table border="1" class="tabla_panel tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Rol</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Ciudad</th>
                        <th>Provincia</th>
                        <th>Fecha registro</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <?php foreach ($_SESSION['lista_usuarios'] as $usuario): ?>
                        <tr>
                            <td><?= $usuario['id'] ?></td>
                            <td>
                                <?php if ($usuario['rol_id'] == 1): ?>
                                    <span style="color: red;">Admin</span>
                                <?php else: ?>
                                    <span style="color: green;">Usuario</span>
                                <?php endif; ?>
                            </td>
                            <td><?= $usuario['nombre'] ?></td>
                            <td><?= $usuario['email'] ?></td>
                            <td>
                                <span><?php echo !empty($usuario['ciudad']) ? $usuario['ciudad'] : 'N/A' ?></span>
                            </td>
                            <td>
                                <span><?php echo !empty($usuario['provincia']) ? $usuario['provincia'] : 'N/A' ?></span>
                            </td>
                            <td><?php echo date('d/m/Y', strtotime($usuario['create_time'])) ?></td>
                            <td>
                                <a href="#">Editar</a>
                                <a href="#">Crear</a>
                                <a href="#">Eliminar</a>
                            </td>
                        </tr>
                    <?php endforeach; ?>
                </tbody>
            </table>
            <?php unset($_SESSION['lista_usuarios']); // Limpia después 
            ?>
        <?php else: ?>
            <p>No hay usuarios</p>
        <?php endif; ?>
    </div>
</article>
