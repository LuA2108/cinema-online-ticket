    <!-- CONTENIDO -->
    </main>
    <article class="d-flex justify-content-center mt-4">

        <div class="card border-0 shadow-lg bg-white bg-opacity-75 w-100"
            style="max-width:600px; backdrop-filter: blur(6px);">

            <div class="card-header text-white" style="background:#2c3e50;">
                <h5 class="mb-0">Película</h5>
            </div>

            <div class="card-body">

                <form id="form-pelicula" enctype="multipart/form-data">

                    <input class="form-control mb-2" name="titulo" placeholder="Título">

                    <textarea class="form-control mb-2" name="descripcion" placeholder="Descripción"></textarea>

                    <input class="form-control mb-2" name="director" placeholder="Director">

                    <div class="row">
                        <div class="col">
                            <input class="form-control mb-2" type="number" name="anio" placeholder="Año">
                        </div>
                        <div class="col">
                            <input class="form-control mb-2" type="number" name="duracion" placeholder="Min">
                        </div>
                    </div>

                    <input class="form-control mb-2" type="number" step="0.01" name="precio" placeholder="Precio">

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" name="disponible">
                        <label class="form-check-label">Disponible</label>
                    </div>

                    <input class="form-control mb-2" type="file" name="poster">
                    <input class="form-control mb-2" type="file" name="banner">

                    <select class="form-select mb-3" name="generos[]" multiple></select>

                    <button class="btn w-100 text-white" style="background:#2c3e50;">
                        Guardar
                    </button>

                </form>

            </div>
        </div>

    </article>
    </main>
