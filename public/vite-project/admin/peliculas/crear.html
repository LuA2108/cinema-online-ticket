<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cinema Online Ticket</title>
    <meta name="description" content='Cinema Online Ticket'>
    <meta name="author" content="Lucero Anay Cahuana Cornejo">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="64x42" href="../../../assets/iconos/logo-limpio.png">
    <!-- BootStrap - Font Awesome - Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/b527a55e68.js" crossorigin="anonymous"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,50₀;1,6₀;1,7₀;1,8₀;1,9₀&family=Roboto:ital,wght@₀,1₀₀..9₀₀;1,1₀₀..9₀₀&display=swap">

    <!-- CSS global -->
    <link rel="stylesheet" href="../../src/style/css/main.css">

</head>

<body class="admin">

    <!-- CHECKBOX -->
    <input type="checkbox" id="openSidebarMenu" checked>

    <!-- BOTÓN HAMBURGUESA -->
    <label for="openSidebarMenu" class="sidebarIconToggle">
        <div class="spinner"></div>
        <div class="spinner"></div>
        <div class="spinner"></div>
    </label>

    <!-- HEADER -->
    <header class="header-admin">
    </header>

    <!-- SIDEBAR -->
    <aside class="sidebar-menu">

        <div class="container-admin">
            <img src="../../src/assets/admin-con-ruedas-dentadas.png" alt="Administrador">

            <h2>Administrador</h2>
        </div>

        <hr>

        <ul class="sidebar-menu-inner">

            <li>Panel de control</li>

            <li>
                <a href="/public/vite-project/src/pages/admin/index.html">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/usuarios/index.html">
                    <i class="fa-solid fa-user"></i>
                    Usuarios
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/peliculas/index.html">
                    <i class="fa-solid fa-video"></i>
                    Películas
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/generos/index.html">
                    <i class="fa-solid fa-masks-theater"></i>
                    Géneros películas
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/funciones/index.html">
                    <i class="fa-solid fa-tv"></i>
                    Funciones
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/reservas/index.html">
                    <i class="fa-solid fa-calendar"></i>
                    Reservas
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/salas/index.html">
                    <i class="fa-solid fa-clapperboard"></i>
                    Salas
                </a>
            </li>

            <li>
                <a href="/public/vite-project/src/pages/admin/productos/index.html">
                    <i class="fa-solid fa-candy-cane"></i>
                    Productos
                </a>
            </li>
        </ul>

        <form action="#" method="POST">
            <button type="submit">
                Cerrar sesión
            </button>
        </form>

    </aside>

    <!-- CONTENIDO -->
    <main class="main-admin">
        <article class="d-flex justify-content-center mt-4">

            <div class="card border-0 shadow-lg bg-white w-100" style="max-width:700px;">

                <div class="card-header text-white" style="background:#2c3e50;">
                    <h5 class="mb-0">Crear Película</h5>
                </div>

                <div class="card-body text-dark">

                    <form id="form-pelicula" enctype="multipart/form-data">

                        <!-- ===================== -->
                        <!-- DATOS PELÍCULA -->
                        <!-- ===================== -->

                        <h6 class="mb-2 text-dark">Datos de la película</h6>

                        <label class="form-label text-dark">Título</label>
                        <input class="form-control mb-2" name="titulo">

                        <label class="form-label text-dark">Descripción</label>
                        <textarea class="form-control mb-2" name="descripcion"></textarea>

                        <label class="form-label text-dark">Director</label>
                        <input class="form-control mb-2" name="director">

                        <!-- ===================== -->
                        <!-- AÑO / DURACIÓN / PRECIO / ESTADO -->
                        <!-- ===================== -->

                        <div class="row mb-3">

                            <div class="col-md-3">
                                <label class="form-label text-dark">Año</label>
                                <input class="form-control" type="number" name="anio">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label text-dark">Duración</label>
                                <input class="form-control" type="number" name="duracion">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label text-dark">Precio</label>
                                <input class="form-control" type="number" step="0.01" name="precio">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label text-dark">Estado</label>

                                <div class="form-check form-switch mt-2">
                                    <input class="form-check-input" type="checkbox" name="disponible" role="switch">
                                    <label class="form-check-label text-dark">
                                        Activo
                                    </label>
                                </div>
                            </div>

                        </div>

                        <hr>

                        <!-- ===================== -->
                        <!-- IMÁGENES (UNA LÍNEA) -->
                        <!-- ===================== -->

                        <h6 class="mb-2 text-dark">Imágenes</h6>

                        <!-- POSTER -->
                        <div class="row mb-3 align-items-end">

                            <div class="col-md-5">
                                <label class="form-label text-dark">Poster</label>
                                <input class="form-control" type="file" name="poster_file" accept="image/*">
                            </div>

                            <div class="col-md-7">
                                <label class="form-label text-dark">Tipo: Poster</label>
                                <input class="form-control" value="poster" disabled>
                            </div>

                        </div>

                        <!-- BANNER -->
                        <div class="row mb-3 align-items-end">

                            <div class="col-md-5">
                                <label class="form-label text-dark">Banner</label>
                                <input class="form-control" type="file" name="banner_file" accept="image/*">
                            </div>

                            <div class="col-md-7">
                                <label class="form-label text-dark">Tipo: Banner</label>
                                <input class="form-control" value="banner" disabled>
                            </div>

                        </div>

                        <hr>

                        <!-- ===================== -->
                        <!-- GÉNEROS -->
                        <!-- ===================== -->

                        <h6 class="mb-2 text-dark">Géneros</h6>

                        <label class="form-label text-dark">Selecciona géneros</label>
                        <select class="form-select mb-3" name="generos[]" multiple>
                            <option value="1">Acción</option>
                            <option value="2">Comedia</option>
                            <option value="3">Drama</option>
                            <option value="4">Terror</option>
                            <option value="5">Ciencia Ficción</option>
                        </select>

                        <button class="btn w-100 text-white" style="background:#2c3e50;">
                            Crear película
                        </button>

                    </form>

                </div>
            </div>

        </article>
    </main>
    <footer>
        <script type="module" src="/public/vite-project/src/app/admin/pelicula.js"></script>
    </footer>
</body>

</html>
